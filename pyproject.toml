[project]
name = "enterprise-after-sales-kb-agent"
version = "0.1.0"
description = "Enterprise After-Sales Knowledge Base Intelligent Q&A and Ticket Automation Agent Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "black==26.5.1",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
