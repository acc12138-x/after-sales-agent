# 已知故障码白名单（从产品手册、历史工单、规则引擎汇总）
# 加新故障码只需加一行
error_codes:
  E1:
    description: "通用故障 E1"
  E2:
    description: "通用故障 E2"
  E3:
    description: "通用故障 E3"
  E102:
    description: "温度传感器异常"
    aliases: ["温度传感器", "感温器"]
  E200:
    description: "电源模块异常"
    aliases: ["电源", "供电"]
  E098:
    description: "通信模块异常"
  E130:
    description: "电机过载"
  E310:
    description: "风扇转速异常"
  # 设备型号（也可以作为"码"）
  XY100: { description: "XY100 智能设备" }
  XY200: { description: "XY200 智能设备" }
  XY300: { description: "XY300 旗舰设备" }

# 校验规则
validator:
  # 编辑距离阈值：距离 <= N 认为"可能打错"
  edit_distance_threshold: 2
  # 未知码是否允许建单
  allow_unknown: true
