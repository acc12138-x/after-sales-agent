# 飞书群路由配置
# 「事件 → 群」的映射写在这里；群的 webhook 请放 .env，不要写进本文件。
#
# ⚠️ webhook 是密钥（拿到就能往对应群里发消息），而本文件被 git 跟踪，
#    所以 webhook 一律留空，改用环境变量（.env 已被 .gitignore 排除）：
#        engineer_group   -> FEISHU_WEBHOOK_ENGINEER_GROUP
#        supervisor_group -> FEISHU_WEBHOOK_SUPERVISOR_GROUP
#        sla_group        -> FEISHU_WEBHOOK_SLA_GROUP
#        customer_channel -> FEISHU_WEBHOOK_CUSTOMER_CHANNEL
#    （后台「飞书配置」页面保存时也会自动写进 .env）
#
# webhook 未配置的群：只记通知表，不发飞书。

channels:
  # 工程师群
  engineer_group:
    label: "售后工程师群"
    webhook: ""           # ← 留空；真实值走 FEISHU_WEBHOOK_ENGINEER_GROUP
    at_all: false

  # 主管群
  supervisor_group:
    label: "售后主管群"
    webhook: ""
    at_all: true

  # SLA 预警群
  sla_group:
    label: "SLA 预警群"
    webhook: ""
    at_all: false

  # 客户端
  customer_channel:
    label: "客户端"
    webhook: ""
    at_all: false

# 事件 → 群映射
routes:
  ticket_assigned:        ["engineer_group"]           # 新工单派给工程师
  ticket_accepted:        ["engineer_group"]
  ticket_rejected:        ["engineer_group"]           # 拒单通知群里
  ticket_resolved:        ["supervisor_group"]         # 完成待主管审批
  ticket_escalated:       ["supervisor_group"]         # 升级到主管

  refund_created:         ["supervisor_group"]
  refund_pending:         ["supervisor_group"]         # 待审批
  refund_approved:        ["customer_channel"]         # 通过通知客户
  refund_rejected:        ["customer_channel"]

  sla_warning:            ["sla_group"]                # 预警
  sla_overdue:            ["sla_group", "supervisor_group"]
  sla_overdue_supervisor: ["supervisor_group"]
