# ============================================================
# 宿主机 nginx 站点配置：售后知识库 Agent
#
# 适用场景：服务器上【已经装了宿主机 nginx】，80/443 被它占着，
#           不想再起一个 Caddy。这时直接复用现有 nginx 最省事。
#
# 部署步骤
#   1) 确认 /etc/nginx/nginx.conf 的 http{} 里有这一行（没有就加上）：
#          include /etc/nginx/conf.d/*.conf;
#      注意：阿里云/Anolis 等镜像的默认 nginx.conf 可能【没有】这行，
#      此时要么补上，要么把本文件内容直接贴进 nginx.conf 的 http{} 里。
#
#   2) 把本文件复制成 /etc/nginx/conf.d/agent.conf，把所有 <你的域名>
#      替换成真实域名（例如 agent.example.com）。
#
#   3) 前端产物要放在 /opt/apps/after-sales/frontend/dist。
#      服务器上没有 Node 的话，用 deploy/docker-compose.web.yml 构建。
#
#   4) sudo nginx -t && sudo systemctl reload nginx
#
# 关于 HTTPS
#   本文件是【已经配好证书】的最终形态。如果还没申请证书，
#   请先删掉下面第二个 server 块（443），并把第一个 server 块里的
#   `location / { return 301 ... }` 换成：
#       root /opt/apps/after-sales/frontend/dist;
#       index index.html;
#       location / { try_files $uri $uri/ /index.html; }
#       location /api/ { ... }        # 和 443 那段一样
#   先跑通 http，再申请证书。
#
#   申请证书两条路：
#     a) 宿主机装了 certbot：  sudo certbot --nginx -d <你的域名>
#     b) 没装（部分发行版仓库里确实没有 certbot）：
#        用 Docker 版，不会动你的 nginx 配置：
#        sudo docker run --rm \
#          -v /etc/letsencrypt:/etc/letsencrypt \
#          -v /var/lib/letsencrypt:/var/lib/letsencrypt \
#          -v /opt/apps/after-sales/frontend/dist:/var/www/html \
#          certbot/certbot certonly --webroot -w /var/www/html \
#          -d <你的域名> --agree-tos --non-interactive -m <你的邮箱>
# ============================================================

server {
    listen 80;
    server_name <你的域名>;

    # 让证书【续期】的校验请求直接通过，不被下面的 301 拦住
    location /.well-known/acme-challenge/ {
        root /opt/apps/after-sales/frontend/dist;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name <你的域名>;

    ssl_certificate     /etc/letsencrypt/live/<你的域名>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<你的域名>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 5m;

    # 前端构建产物（由 deploy/docker-compose.web.yml 生成，或本地构建后上传）
    root /opt/apps/after-sales/frontend/dist;
    index index.html;

    # Vue 用的是 history 路由：刷新 /tickets 这类子路径不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端 axios 的 baseURL 是 /api，这里剥掉前缀再转给后端容器。
    # ⚠️ proxy_pass 结尾的 / 不能少 —— 少了前缀就剥不掉，接口全 404。
    location /api/ {
        proxy_pass http://127.0.0.1:18001/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 对话是流式（SSE），必须关缓冲，否则回复会憋着不出来
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
